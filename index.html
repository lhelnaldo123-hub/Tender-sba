<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2a8f"><title>TSCS SBA System</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="Screenshot_20261030-124739.png">
<link rel="apple-touch-icon" href="Screenshot_20261030-124739.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TSCS SBA"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--b:#0b2a8f;--b2:#1d44c4;--d:#061a63;--y:#f5b800;--yl:#fff3c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#f2f5fc;color:#1b2133}
[hidden]{display:none!important}
input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #c9d1e6;padding:11px;margin:4px 0;max-width:100%;background:#fff;color:#1b2133}
input,select,textarea{width:100%}
button{background:var(--b);color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
button.y{background:var(--y);color:#1b2133}button.r{background:#c0392b;padding:8px 11px;margin:0}
.mu{color:#667089;font-size:13px}.er{color:#ffd1d1;font-size:13px;margin:10px 0 0}
.bg{background:radial-gradient(circle at 50% 28%,var(--b2),var(--b) 55%,var(--d));color:#fff;overflow:hidden}
.bg:before{content:"";position:absolute;right:-100px;top:-100px;width:270px;height:270px;border-radius:50%;background:var(--y)}
.bg:after{content:"";position:absolute;left:-120px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:#ffffff14}
.bg>*{position:relative;z-index:1}
#sp{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s,visibility .6s}
#sp.out{opacity:0;visibility:hidden}
.lgo{width:150px;height:150px;border-radius:38px;background:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 0 0 7px #f5b80066,0 20px 44px #0007;animation:pop .8s ease both}
.lgo.sm{width:118px;height:118px;border-radius:30px}
.lgo img{width:82%}.fb{display:none;font-weight:900;font-size:34px;color:var(--b)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
#sp h1{font-size:21px;letter-spacing:2px;margin:22px 0 4px}
.pill{display:inline-block;margin-top:8px;background:var(--y);color:#1b2133;font-weight:900;letter-spacing:5px;padding:7px 20px;border-radius:22px;font-size:13px}
.ld{display:flex;gap:9px;justify-content:center;margin-top:30px}
.ld i{width:12px;height:12px;border-radius:50%;background:var(--y);animation:bn 1s infinite ease-in-out}
.ld i:nth-child(2){animation-delay:.18s}.ld i:nth-child(3){animation-delay:.36s}
@keyframes bn{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
.vis{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#ffd75e;font-weight:700}
#lg{min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 70px;text-align:center}
.lb{background:#fff;color:#1b2133;border-radius:24px;padding:22px;width:100%;max-width:370px;margin-top:22px;border-bottom:7px solid var(--y);text-align:left}
.lb h2{margin:0 0 6px;color:var(--b);font-size:19px}
.pwr{position:relative}.pwr button{position:absolute;right:4px;top:8px;background:none;color:var(--b);padding:6px 10px;margin:0}
.lb .go{width:100%;background:var(--b);margin-top:8px;padding:13px}
.lb .er{color:#b3261e}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:4px solid var(--y)}
header .lo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center}header .lo img{width:32px}header .lo b{display:none;color:var(--b);font-size:12px}
header .t1{flex:1;line-height:1.2;font-size:15px;font-weight:800}header small{font-weight:400;opacity:.9;font-size:11px}
header button{background:#ffffff26;margin:0;padding:8px 12px}
main{max-width:1000px;margin:auto;padding:12px}
.r2{display:flex;gap:6px}.r2>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px}.tabs button{flex:none;background:#e6ebf8;color:var(--b);padding:9px 14px;margin:0;border-radius:20px;white-space:nowrap}
.tabs .on{background:var(--y);color:#1b2133;box-shadow:0 2px 6px #0003}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999}.dot.on{background:#3ddc84}
.tw{overflow:auto;background:#fff;border-radius:12px;max-height:70vh;box-shadow:0 1px 4px #0001}
table.t{border-collapse:collapse;width:100%;font-size:12px}.t th{background:var(--b);color:#fff;padding:6px;white-space:nowrap;border-bottom:3px solid var(--y)}
.t td{border:1px solid #e1e6f4;padding:3px;text-align:center;white-space:nowrap}
.t td.pn,.t th.pn{position:sticky;left:0;text-align:left;min-width:120px;font-weight:600}.t td.pn{background:#fff}.t th.pn{z-index:2}
.t input{width:54px;padding:6px 2px;text-align:center;margin:0}.sb{background:var(--yl);font-weight:700}.rm{font-size:11px;color:#445}
.gx{font-size:11px;color:#667089;min-height:13px}
.c{background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px #0001;border-left:5px solid var(--y)}
.c .g1{flex:1;min-width:0}.ac{display:flex;gap:5px}.ac button{padding:8px 11px;margin:0}
.ac button.off{background:#e6ebf8;color:#667089}.ac button.pp1{background:#1e9e58}.ac button.aa1{background:#c0392b}
.bar{height:9px;background:#e6ebf8;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),#ffd75e)}
.fm{background:#fff;border-radius:14px;padding:12px;border-top:5px solid var(--y);box-shadow:0 1px 4px #0001;margin:8px 0}
.fm label.l1{display:block;font-size:12px;font-weight:700;color:var(--b);margin-top:6px}
.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:13px}.chk label,.chk1{display:flex;align-items:center;gap:5px}.chk input,.chk1 input{width:auto;margin:0}
.chk1{font-size:13px;margin:8px 0}
/* ---- report card colour templates ---- */
.th-y{--pa:#0b2a8f;--ac:#f5b800;--rt:#f5b800;--bg1:#fff2b0;--bg2:#fffbe0;--bd:#d9a500;--tx:#5a4a1a;--ink:#0d1f8f;--cell:#fffdf0;--ln:#8a6a00;--bar:rgba(245,184,0,.45)}
.th-b{--pa:#0b2a8f;--ac:#3b82f6;--rt:#ffffff;--bg1:#cfe0ff;--bg2:#f3f8ff;--bd:#2f5fd0;--tx:#1f3a7a;--ink:#0a1a6e;--cell:#fbfdff;--ln:#5b7fd0;--bar:rgba(59,130,246,.28)}
.th-p{--pa:#b0125f;--ac:#ff5fa2;--rt:#ffe3f0;--bg1:#ffd0e4;--bg2:#fff4f9;--bd:#e0529a;--tx:#7a2150;--ink:#8a0f4d;--cell:#fffafc;--ln:#d77aa8;--bar:rgba(255,95,162,.30)}
.th-c{--pa:#14213d;--ac:#4a5a8a;--rt:#ffffff;--bg1:#e3e8f5;--bg2:#ffffff;--bd:#6b7280;--tx:#1f2a44;--ink:#14213d;--cell:#ffffff;--ln:#8a93a8;--bar:rgba(74,90,138,.30);--ttl:#1565ff;--hd:#111}
.th-g{--pa:#0b6b3a;--ac:#22a55e;--rt:#ffffff;--bg1:#c9f2d9;--bg2:#f3fff8;--bd:#1f8f55;--tx:#1d4d33;--ink:#0a5a2e;--cell:#fbfffc;--ln:#5bb584;--bar:rgba(34,165,94,.30)}
.th-v{--pa:#5b21b6;--ac:#a78bfa;--rt:#ffffff;--bg1:#e4d9ff;--bg2:#f8f5ff;--bd:#7c4dd6;--tx:#402a7a;--ink:#4a1d9a;--cell:#fcfaff;--ln:#9a7de0;--bar:rgba(167,139,250,.38)}
.th-o{--pa:#c2410c;--ac:#fb923c;--rt:#ffffff;--bg1:#ffe0c7;--bg2:#fff8f2;--bd:#e0702a;--tx:#7a3510;--ink:#a33208;--cell:#fffcf9;--ln:#e09a62;--bar:rgba(251,146,60,.38)}
.ink{font-family:'Caveat','Segoe Script','Bradley Hand','Comic Sans MS',cursive;color:var(--ink,#0d1f8f);font-weight:700;font-size:17px;line-height:1.15}
.card{position:relative;overflow:hidden;background:linear-gradient(var(--bg1),var(--bg2) 30%,var(--bg1));border:2px solid var(--bd);outline:2px solid var(--ac);outline-offset:-8px;border-radius:8px;padding:20px 18px;max-width:760px;margin:8px auto;color:#1b2133;font-size:13px}
.card>*{position:relative;z-index:1}
.ch{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--pa);padding-bottom:8px}
.lo2{width:62px;height:62px;border-radius:14px;background:#fff;display:grid;place-items:center;border:2px solid var(--pa);flex:none}.lo2 img{width:50px}.lo2 b{display:none;color:var(--pa)}
.sn{font-weight:900;color:var(--pa);font-size:20px;letter-spacing:1px;line-height:1.1}.sl{font-size:11px;letter-spacing:3px;color:var(--tx);text-transform:uppercase;margin-top:3px}
.rb{background:var(--pa);color:var(--rt);text-align:center;font-weight:900;letter-spacing:5px;padding:6px;margin:10px 0;border-radius:4px}
.inf{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-bottom:10px}.inf div{border-bottom:1px dotted var(--ln);padding-bottom:1px}
.inf small,.sm small{color:var(--tx);font-weight:700;text-transform:uppercase;font-size:10px;margin-right:5px}
.rt{width:100%;border-collapse:collapse}.rt th{background:var(--pa);color:#fff;padding:5px;font-size:11px;border:1px solid var(--pa)}
.rt td{border:1px solid var(--bd);padding:2px 5px;text-align:center;background:var(--cell)}.rt td.sj{text-align:left;font-weight:700;font-size:12px}.rt td.l{text-align:left}
.sm{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.sm div{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:4px;text-align:center}.sm small{display:block;margin:0}
.ln{border-bottom:1px dotted var(--ln);min-height:26px;margin:3px 0 8px;padding-top:2px}
.lb2{font-size:10px;font-weight:700;color:var(--tx);text-transform:uppercase}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}.sg div{position:relative;border-top:1px solid #1b2133;text-align:center;font-size:11px;padding-top:2px}
.sg .sgi{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);max-height:46px;max-width:90%}
.sgi{max-height:44px;mix-blend-mode:multiply}
.ky{font-size:10px;color:var(--tx);margin-top:10px;border-top:1px solid var(--bd);padding-top:4px}
.nt{font-size:10.5px;color:var(--tx);margin-top:6px;line-height:1.35}
.up{color:#0a7d3b}.dn{color:#c0392b}
.th-y .ch{border-bottom:3px double var(--pa)}
.th-y .rb:before{content:"★  "}.th-y .rb:after{content:"  ★"}
.th-b.card{border:1px solid var(--bd);border-top:14px solid var(--pa);border-bottom:14px solid var(--pa);outline:0;border-radius:4px;background:var(--bg2)}
.th-b.card:before,.th-b.card:after{content:"";position:absolute;width:150px;height:150px;z-index:0;opacity:.6}
.th-b.card:before{top:0;right:0;background:linear-gradient(225deg,var(--bg1) 0 50%,transparent 50%)}
.th-b.card:after{bottom:0;left:0;background:linear-gradient(45deg,var(--bg1) 0 50%,transparent 50%)}
.th-b .ch{border-bottom:4px solid var(--ac)}
.th-b .rb{background:linear-gradient(90deg,var(--pa),var(--ac));border-radius:0;color:#fff}
.th-b .sm div{border-left:5px solid var(--ac)}
.th-b .rt th{background:var(--pa)}
.th-p.card{border:4px dotted var(--ac);outline:3px solid var(--pa);outline-offset:-11px;border-radius:28px;background:radial-gradient(circle at 0 0,var(--bg1) 0 110px,transparent 111px),radial-gradient(circle at 100% 100%,var(--bg1) 0 110px,transparent 111px),var(--bg2)}
.th-p .ch{border-bottom:3px dotted var(--ac)}
.th-p .lo2{border-radius:50%}
.th-p .rb{border-radius:30px}
.th-p .rb:before{content:"❀  "}.th-p .rb:after{content:"  ❀"}
.th-p .rt th:first-child{border-top-left-radius:10px}.th-p .rt th:last-child{border-top-right-radius:10px}
.th-p .sm div{border-radius:14px;border:2px dashed var(--ac)}
.th-p .sg div{border-top:2px dotted var(--pa)}
.th-c.card{outline:0;border-radius:4px;background:#fff;border:1px solid var(--bd)}
.th-c .rb{background:var(--hd)}
.th-g.card,.th-v.card,.th-o.card{border-radius:6px;border-top:12px solid var(--pa);border-bottom:12px solid var(--pa);outline:2px solid var(--ac);outline-offset:-8px}
.mc .ch{background:var(--pa);margin:-20px -18px 0;padding:14px 18px;border-bottom:4px solid var(--ac)}
.mc .sn{color:#fff}.mc .sl{color:var(--ac)}.mc .lo2{border-color:var(--ac)}
.mc .rb{background:#fff;color:var(--pa);border:2px solid var(--pa);letter-spacing:3px;font-size:13px;margin-top:12px}
.mc .rb:before,.mc .rb:after{content:""}
.card>.stamp{position:absolute;right:16px;top:12px;width:66px;height:66px;border-radius:50%;background:var(--ac);color:#1b2133;border:3px double #fff;display:grid;place-items:center;align-content:center;text-align:center;font-weight:900;font-size:11px;line-height:1;transform:rotate(12deg);z-index:2}
.stamp b{font-size:24px;display:block}
.mt2 td.ink{font-size:16px}
/* ---- NEW end-of-term report card (picture style) ---- */
.rc2{background:#fff;border:1px solid var(--bd,#777);max-width:760px;margin:8px auto;color:#111;font-size:11px;position:relative;overflow:hidden}
.rc2:not(.th-c){border-top:7px solid var(--pa);border-bottom:7px solid var(--pa)}
.rc2 .rh{display:flex;align-items:center;gap:18px;padding:16px 20px;border-bottom:1px solid var(--bd,#777);min-height:112px}
.rc2 .rh .lo2{width:78px;height:78px;border:0;background:none;border-radius:0}.rc2 .rh .lo2 img{width:78px}
.rc2 .rh h2{margin:0 0 4px;font-size:21px;line-height:1.1;color:var(--ttl,var(--pa));font-weight:800;font-family:Arial,Helvetica,sans-serif}
.rc2 .rh p{margin:1px 0;font-size:9.5px;color:#444}
.rc2 .bd2{padding:8px 10px 10px}
.rc2 .ri{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;font-size:10px;line-height:1.55;margin-bottom:6px}
.rc2 .ri>div:nth-child(2){flex:1;padding-left:30px}
.rc2 .ph2{width:78px;height:92px;border:1px solid #888;display:grid;place-items:center;color:#999;font-size:9px;overflow:hidden;flex:none}
.rc2 .ph2 img{width:100%;height:100%;object-fit:cover}
.rt2{width:100%;border-collapse:collapse;font-size:10.5px}
.rt2 th{background:var(--hd,var(--pa));color:#fff;border:1px solid #111;padding:4px;font-size:10px}
.rt2 td{border:1px solid #111;padding:3px 5px;text-align:center}.rt2 td.sj{text-transform:uppercase}
.rs{display:flex;gap:14px;margin:10px 0 4px;font-size:10.5px;line-height:1.65}
.rs>div:first-child{width:36%;padding-left:4px}.rs>div:last-child{flex:1}
.cg{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
.cg>div:first-child{flex:1.35;min-width:0}.cg>div:last-child{flex:1}
.cg h4,.bl h4{margin:0 0 4px;text-align:center;font-size:12.5px;font-weight:600}
.gt2{width:100%;border-collapse:collapse;font-size:9.5px}.gt2 th{background:#e3e3e3;border:1px solid #111;padding:2px}.gt2 td{border:1px solid #111;padding:2px 3px;text-align:center}
.bl{margin-top:16px}.bl table{width:100%;border-collapse:collapse;font-size:10.5px}.bl th{background:var(--bg1);border:1px solid #111;padding:3px}.bl td{border:1px solid #111;padding:3px;text-align:center}
.ft2{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;font-size:10px}
.ft2 .hs{display:flex;align-items:flex-end;gap:6px;white-space:nowrap}
/* ---- notice-board analysis sheet (one A4 landscape page) ---- */
.pv{width:100%;overflow:hidden;margin-top:8px}.pv>div{width:281mm}
.msheet{width:281mm;height:188mm;display:flex;flex-direction:column;background:#fff;color:#111;border:1.2mm solid var(--pa);border-radius:3mm;overflow:hidden}
.mbn{display:flex;align-items:center;gap:4mm;background:linear-gradient(100deg,var(--pa),var(--pa) 70%,var(--ac));color:#fff;padding:2.5mm 5mm;border-bottom:1.5mm solid var(--ac)}
.mbn .lo2{width:15mm;height:15mm;border-radius:3mm;border:0}.mbn .lo2 img{width:13mm}
.mtt{flex:1}.m1{font-weight:900;font-size:6.5mm;letter-spacing:.6mm;line-height:1}.m2{font-size:3.8mm;font-weight:800;color:#ffe08a;margin-top:1mm;letter-spacing:.4mm}
.m3{text-align:right;font-weight:800;font-size:3.6mm;line-height:1.25}
.mbd{flex:1;min-height:0;padding:1.5mm 2mm 0;overflow:hidden}
.mtb{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--fs)}
.mtb th{background:var(--pa);color:#fff;font-size:calc(var(--fs)*.85);padding:.6mm 0;text-align:center;border:.2mm solid var(--pa);overflow:hidden;white-space:nowrap}
.mtb td{height:var(--rh);line-height:1;padding:0 .6mm;text-align:center;border:.2mm solid #cbd3e8;overflow:hidden;white-space:nowrap}
.mtb tbody tr:nth-child(even){background:var(--bg2)}
.mtb td.mn{text-align:left;font-weight:700;text-overflow:ellipsis}
.mtb sup{font-size:.6em;line-height:0;color:var(--pa);margin-left:.2mm;vertical-align:top}
.mp1{font-weight:900;color:var(--pa)}.mtt2{font-weight:900;background:var(--bg1)}.mag{font-weight:900;color:var(--pa);background:var(--bg1)}
.mtb tbody tr.top1{background:#ffe27a}.mtb tbody tr.top2{background:#e5e9f2}.mtb tbody tr.top3{background:#f4d3b2}
.mtb tr.mf td{background:var(--pa);color:#fff;font-weight:800}.mtb tr.mf td:first-child{text-align:left}
.mft{display:flex;justify-content:space-between;gap:4mm;font-size:2.4mm;color:#445;padding:1mm 3mm;border-top:.4mm solid var(--ac)}
.prt{display:none}
.ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid var(--y);margin-bottom:6px;color:var(--b)}.ph span{font-size:12px;font-weight:700}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;border:2px solid var(--y);max-width:90%;text-align:center}
@page card{size:A4 portrait;margin:8mm}
@page sheet{size:A4 landscape;margin:8mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#fff}#ap,#lg,#sp,#tt,#pm,#pg,.pdfx{display:none!important}.prt{display:block}
.pgc{page:card;break-after:page;page-break-after:always}.pgs{page:sheet;break-after:page;page-break-after:always}
.pgc .card,.pgc .rc2{margin:0}.pgc:last-child,.pgs:last-child{break-after:auto;page-break-after:auto}.msheet{box-shadow:none}
.prt .t{font-size:9.5px;margin-bottom:10px}.prt .t td,.prt .t th{padding:2px}.prt .t tr{page-break-inside:avoid}.prt thead{display:table-header-group}
.t td.pn,.t th.pn{position:static}.prt .rm{font-size:8px}}
/* ---- save-as-PDF menu + progress ---- */
#pm{position:fixed;inset:0;z-index:50;background:#0006;display:flex;align-items:flex-end}
.sh{background:#fff;width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.sh button{width:100%;padding:13px;margin:5px 0}
#pg{position:fixed;inset:0;z-index:200;background:var(--b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#pg p{font-size:17px;font-weight:700;margin:18px 0 4px}
.pdfx{position:fixed;left:0;top:0;width:794px;background:#fff;z-index:150}
.pdfx .rc2,.pdfx .card{margin:0!important;max-width:none!important}
.pdfx .rc2{font-size:11.5px}.pdfx .card{font-size:12px}

/* ---------- Shared calculation (every subject linked) ---------- */
function calc(){
 const j=jhs(cls),ss=subs(cls),rows=stu.map(s=>({s,sub:{},gt:0,n:0}));
 ss.forEach(x=>{const r=rows.map(o=>cs((sc[x]||{})[o.s.id])),p=rank(r.map(y=>y&&y.t));
  rows.forEach((o,i)=>{const y=r[i];if(y){const g=gr(y.t,j);o.sub[x]={c:y.c,e:y.e,t:y.t,g:g[0],m:g[1],p:p[i]};o.gt+=y.t;o.n++}})});
 rows.forEach(o=>{o.avg=o.n?Math.round(o.gt/o.n):0;o.ag=j?agg(o.sub,ss):null});
 const rk=rows.filter(o=>o.n).sort((a,b)=>j?((a.ag??99)-(b.ag??99))||b.gt-a.gt:b.gt-a.gt);
 rows.forEach(o=>o.pos=o.n?rk.findIndex(x=>x.gt===o.gt&&x.ag===o.ag)+1:"");
 return rows}

const U_H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",U_PDF="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",U_ZIP="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
const LP={};
const loadJS=u=>LP[u]||(LP[u]=new Promise((res,rej)=>{const e=document.createElement("script");e.src=u;e.onload=res;e.onerror=()=>{delete LP[u];rej(new Error("load"))};document.head.appendChild(e)}));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fnm=x=>String(x).replace(/[\\\/:*?"<>|]+/g,"").trim().replace(/\s+/g,"_")||"pupil";

function prog(m){const g=$("#pg");if(!m){g.hidden=true;return}g.hidden=false;g.querySelector("p").textContent=m}
async function cardCanvas(html){
 const h=document.createElement("div");h.className="pdfx";h.innerHTML=html;document.body.appendChild(h);
 /* A4 FIX: stretch the card to the exact A4 shape so it fills the whole page */
 const c0=h.firstElementChild;if(c0){c0.classList.add("fit");c0.style.minHeight=Math.round(794*285/198)+"px"}
 try{
  h.querySelectorAll("svg rect").forEach(r=>{const f=getComputedStyle(r).fill;r.removeAttribute("style");r.setAttribute("fill",f)});
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  await sleep(80);
  return await window.html2canvas(h,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,scrollX:0,scrollY:0,windowWidth:794,windowHeight:1400})
 }finally{h.remove()}}
function addCanvas(pdf,cv,first){
 if(!first)pdf.addPage();
 const pw=210,ph=297,m=6,mw=pw-2*m,mh=ph-2*m;let w=mw,h=cv.height*w/cv.width;if(h>mh){h=mh;w=cv.width*h/cv.height}
 pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",(pw-w)/2,m,w,h)}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
window.pdfGo=async mode=>{
 const it=PM;pdfX();if(!it.length)return;
 if(mode=="print"){printHTML(it.map(i=>`<div class="pgc">${i.html}</div>`).join(""));return}
 const base=(cls+"_"+yr+"_Term"+term+(PK=="mk"?"_Mock"+mk:"")).replace(/[^\w-]+/g,"_");
 try{
  prog("Getting ready…");
  await Promise.all([loadJS(U_H2C),loadJS(U_PDF),mode=="zip"?loadJS(U_ZIP):0]);
  const J=window.jspdf.jsPDF,newPdf=()=>new J({unit:"mm",format:"a4",orientation:"portrait"});
  const one=mode=="one"?newPdf():null,z=mode=="zip"?new window.JSZip():null,used=new Set();
  for(let i=0;i<it.length;i++){
   prog("Making PDF "+(i+1)+" of "+it.length+"…");
   const cv=await cardCanvas(it[i].html);
   let fn=fnm(it[i].name);if(used.has(fn))fn+="_"+(i+1);used.add(fn);
   if(one)addCanvas(one,cv,i==0);
   else{const p=newPdf();addCanvas(p,cv,true);const b=p.output("blob");if(z)z.file(fn+".pdf",b);else{dl(b,fn+".pdf");await sleep(900)}}
   await sleep(20)}
  if(one)dl(one.output("blob"),(it.length==1?fnm(it[0].name):base)+".pdf");
  if(z){prog("Making the ZIP…");dl(await z.generateAsync({type:"blob"}),base+".zip")}
  prog("");toast("Done ✅ Check your Downloads folder")
 }catch(e){prog("");toast("Could not make the PDF. Check your internet and try again.")}};

const ABR={"English":"ENG","Mathematics":"MATHS","Science":"SCI","Social Studies":"SOC.STD","Computing":"COMP","RME":"RME","Creative Arts":"C.ARTS","French":"FRE","Twi":"TWI","Career Technology":"CAR.TECH","History":"HIST"};
const ab=x=>ABR[x]||x.slice(0,5).toUpperCase();
const KEYJ="1: 80–100 Highest · 2: 70–79 Higher · 3: 60–69 High · 4: 55–59 High Average · 5: 50–54 Average · 6: 45–49 Low Average · 7: 40–44 Low · 8: 35–39 Lower · 9: 0–34 Lowest";
const thSel=()=>`<select onchange="setTh(this.value)">${[["c","⚪ Classic (like picture)"],["y","🟡 Yellow design"],["b","🔵 Blue design"],["p","🌸 Pink design"],["g","🟢 Green design"],["v","🟣 Purple design"],["o","🟠 Orange design"]].map(x=>`<option value="${x[0]}" ${th==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>`;
const unfocus=()=>{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()};
window.setTh=v=>{th=v;localStorage.th=v;unfocus();if(tab=="rc")rcv();else if(tab=="mk")mockRender()};
function mockCalc(n=mk){const ss=subs(cls),rows=stu.map(s=>({s,sub:{},gt:0,n:0}));
 ss.forEach(x=>{const k=mkey(x,n),vs=rows.map(o=>{const v=((sc[k]||{})[o.s.id]||[])[0];return v!=null&&v!==""?+v:null}),p=rank(vs);
  rows.forEach((o,i)=>{const t=vs[i];if(t!=null){const g=gr(t,true);o.sub[x]={t,g:g[0],m:g[1],p:p[i]};o.gt+=t;o.n++}})});
 rows.forEach(o=>{o.ag=agg(o.sub,ss);o.avg=o.n?r1(o.gt/o.n):0});
 const rk=rows.filter(o=>o.n).sort((a,b)=>((a.ag??99)-(b.ag??99))||b.gt-a.gt);
 rows.forEach(o=>o.pos=o.n?rk.findIndex(x=>x.gt===o.gt&&x.ag===o.ag)+1:"");return rows}
function mstat(rows,ss){const o={};ss.forEach(x=>{const v=rows.filter(r=>r.sub[x]).map(r=>r.sub[x].t);o[x]={hi:v.length?Math.max(...v):"",av:v.length?r1(v.reduce((a,b)=>a+b,0)/v.length):""}});return o}
const mg=()=>"m"+stu.map(s=>s.id).join()+"|"+cls+YT()+mk+mv;
const mhead=()=>`<div class="r2"><select onchange="setM(this.value)">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n==mk?"selected":""}>Mock ${n}</option>`).join("")}</select><select onchange="setMV(this.value)"><option value="e" ${mv=="e"?"selected":""}>✏️ Enter scores</option><option value="a" ${mv=="a"?"selected":""}>🏆 Analysis sheet</option><option value="r" ${mv=="r"?"selected":""}>📄 Report cards</option></select></div>`;
function mockRender(){SIG=mv=="e"?mg():"";if(mv=="e")mockT();else if(mv=="a")mockAn();else mockRC()}
window.setM=v=>{mk=v;localStorage.mk=v;unfocus();mockRender()};
window.setMV=v=>{mv=v;unfocus();mockRender()};
window.setRP2=v=>{rpid=v;unfocus();mockRC()};
function mockT(){const ss=subs(cls);
 $("#bd").innerHTML=mhead()+(stu.length?`<p class="mu">Basic 9 BECE mock — enter each subject out of 100. Grades 1–9, aggregate (4 core + best 2) and position are automatic. Every teacher sees it live. Use the menu above for the analysis sheet and report cards.</p><div class="tw"><table class="t"><tr><th class="pn">Pupil</th>${ss.map(x=>`<th>${x}<br>/100</th>`).join("")}<th>Total</th><th>Agg</th><th>Pos</th></tr>${stu.map(s=>`<tr data-id="${s.id}"><td class="pn">${esc(s.name)}</td>${ss.map(x=>`<td><input type="number" inputmode="numeric" step="1" min="0" max="100" data-ms="${x}"><div class="gx"></div></td>`).join("")}<td class="mt sb"></td><td class="ma sb"></td><td class="mp sb"></td></tr>`).join("")}</table></div>`:'<p class="mu">No pupils in this class yet.</p>');mockF()}
function mockF(){if(tab!="mk"||mv!="e"||!stu.length)return;
 mockCalc().forEach(o=>{const tr=document.querySelector(`tr[data-id="${o.s.id}"]`);if(!tr)return;
  tr.querySelectorAll("input").forEach(e=>{const x=e.dataset.ms,v=((sc[mkey(x)]||{})[o.s.id]||[])[0];if(document.activeElement!==e)e.value=v??"";e.nextElementSibling.textContent=o.sub[x]?"("+o.sub[x].g+")":""});
  tr.querySelector(".mt").textContent=o.n?o.gt:"";tr.querySelector(".ma").textContent=o.ag??"";tr.querySelector(".mp").textContent=o.pos?ord(o.pos):""})}

/* notice-board sheet: everything squeezed on ONE A4 landscape page, ranked by position */
function board(title,ss,rows,j){
 const L=rows.slice().sort((a,b)=>(a.pos||9999)-(b.pos||9999)||a.s.name.localeCompare(b.s.name)),N=L.length,st=mstat(rows,ss);
 const rh=Math.min(8,150/(N+3)),fs=Math.max(1.9,rh*.58),sw=((100-5-19-5.5*(2+(j?1:0)))/ss.length).toFixed(2);
 const cg=`<colgroup><col style="width:5%"><col style="width:19%">${ss.map(()=>`<col style="width:${sw}%">`).join("")}<col style="width:5.5%"><col style="width:5.5%">${j?'<col style="width:5.5%">':""}</colgroup>`;
 return`<div class="msheet th-${th}" style="--rh:${rh}mm;--fs:${fs}mm"><div class="mbn">${LOGO}<div class="mtt"><div class="m1">TENDER SPROUT COMM. SCHOOL</div><div class="m2">${title}</div></div><div class="m3">${cls}<br>${esc(yr)} · Term ${term}</div></div>
<div class="mbd"><table class="mtb">${cg}<thead><tr><th>POS</th><th>PUPIL</th>${ss.map(x=>`<th>${ab(x)}</th>`).join("")}<th>TOTAL</th><th>AVG</th>${j?"<th>AGG</th>":""}</tr></thead><tbody>${L.map(o=>`<tr class="${o.pos&&o.pos<4?"top"+o.pos:""}"><td class="mp1">${o.pos?ord(o.pos):""}</td><td class="mn">${esc(o.s.name)}</td>${ss.map(x=>{const y=o.sub[x];return`<td>${y?y.t+"<sup>"+y.g+"</sup>":""}</td>`}).join("")}<td class="mtt2">${o.n?o.gt:""}</td><td>${o.n?o.avg:""}</td>${j?`<td class="mag">${o.ag??""}</td>`:""}</tr>`).join("")}<tr class="mf"><td colspan="2">HIGHEST</td>${ss.map(x=>`<td>${st[x].hi}</td>`).join("")}<td colspan="${j?3:2}"></td></tr><tr class="mf"><td colspan="2">CLASS AVERAGE</td>${ss.map(x=>`<td>${st[x].av}</td>`).join("")}<td colspan="${j?3:2}"></td></tr></tbody></table></div>
<div class="mft"><span>${ss.map(x=>ab(x)+" = "+x).join(" · ")}</span><span>Small figure = grade${j?" · AGG = 4 core + best 2 (lower is better)":""} · Printed ${new Date().toLocaleDateString("en-GB")}</span></div></div>`}
function fitPv(){const o=document.querySelector(".pv");if(!o)return;const i=o.firstElementChild;i.style.transform="none";const k=Math.min(1,o.clientWidth/i.offsetWidth);i.style.transformOrigin="0 0";i.style.transform=`scale(${k})`;o.style.height=(i.offsetHeight*k)+"px"}
addEventListener("resize",fitPv);
function mockAn(){const rows=mockCalc();
 $("#bd").innerHTML=mhead()+(stu.length?`${thSel()}<p class="mu">Notice-board sheet for Mock ${mk}: all subjects, totals, aggregate and positions on one A4 landscape page, ranked best to last. Print it and paste it up.</p><button class="y" style="width:100%" onclick="pmA()">🖨 Print analysis sheet</button><div class="pv"><div>${board(cls.toUpperCase()+" · MOCK "+mk+" EXAMINATION · ANALYSIS SHEET",subs(cls),rows,true)}</div></div>`:'<p class="mu">No pupils in this class yet.</p>');fitPv()}
window.pmA=()=>printHTML(`<div class="pgs">${board(cls.toUpperCase()+" · MOCK "+mk+" EXAMINATION · ANALYSIS SHEET",subs(cls),mockCalc(),true)}</div>`);
window.pn=()=>printHTML(`<div class="pgs">${board("TERMINAL REPORT ANALYSIS · NOTICE BOARD",subs(cls),calc(),jhs(cls))}</div>`);

/* mock result slip (report card) */
function mcard(s,rows,prev,n){
 const ss=subs(cls),o=rows.find(r=>r.s.id==s.id),pv=prev&&prev.find(r=>r.s.id==s.id),st=mstat(rows,ss);
 const tr=(a,b)=>a>b?`<span class="up">▲ ${r1(a-b)}</span>`:a<b?`<span class="dn">▼ ${r1(b-a)}</span>`:"＝";
 const L=ss.filter(x=>o.sub[x]).sort((a,b)=>o.sub[b].t-o.sub[a].t),best=L[0],worst=L[L.length-1],ag=o.ag;
 const band=ag==null?"":ag<=10?"Excellent":ag<=15?"Very good":ag<=24?"Good":ag<=35?"Fair":"Needs urgent work";
 const sig=G.sig?`<img class="sgi" src="${G.sig}" alt="">`:"";
 let prog="First mock";
 if(n>1){if(pv&&pv.ag!=null&&ag!=null)prog=ag<pv.ag?`<span class="up">▲ Improved by ${pv.ag-ag}</span>`:ag>pv.ag?`<span class="dn">▼ Dropped by ${ag-pv.ag}</span>`:"＝ Same aggregate";else if(pv&&pv.n&&o.n)prog=tr(o.avg,pv.avg)+" avg";else prog="–"}
 const tbl=ss.map(x=>{const y=o.sub[x],py=pv&&pv.sub[x],w=y?Math.min(100,y.t):0;return`<tr><td class="sj">${x}</td><td class="ink" style="background:linear-gradient(90deg,var(--bar) ${w}%,transparent ${w}%)">${y?y.t:""}</td><td class="ink">${y?y.g:""}</td><td class="ink l">${y?y.m:""}</td><td class="ink">${y?ord(y.p):""}</td><td class="ink">${st[x].av}</td><td class="ink">${y&&py?tr(y.t,py.t):"–"}</td></tr>`}).join("");
 return`<div class="card mc th-${th}"><div class="stamp">MOCK<b>${n}</b></div>
<div class="ch">${LOGO}<div><div class="sn">TENDER SPROUT COMM. SCHOOL</div><div class="sl">Our Vision · Your Future</div></div></div>
<div class="rb">BECE MOCK EXAMINATION ${n} · RESULT SLIP</div>
<div class="inf"><div><small>Candidate</small><span class="ink">${esc(s.name)}</span></div><div><small>Class</small><span class="ink">${cls}</span></div><div><small>Examination</small><span class="ink">Mock ${n}</span></div><div><small>Academic year</small><span class="ink">${esc(yr)} · Term ${term}</span></div></div>
<table class="rt mt2"><tr><th style="text-align:left">Subject</th><th>Score<br>/100</th><th>Grade<br>(1–9)</th><th>Remark</th><th>Position</th><th>Class<br>average</th><th>Vs Mock ${n>1?n-1:"–"}</th></tr>${tbl}</table>
<div class="sm"><div><small>Total marks</small><span class="ink">${o.n?o.gt+" / "+o.n*100:""}</span></div><div><small>Average</small><span class="ink">${o.n?o.avg+"%":""}</span></div><div><small>Aggregate</small><span class="ink">${ag??""}</span></div><div><small>Overall position</small><span class="ink">${o.pos?ord(o.pos)+" of "+stu.length:""}</span></div></div>
<div class="sm" style="margin-top:0"><div><small>Readiness</small><span class="ink">${band}</span></div><div><small>Strongest subject</small><span class="ink">${best?best+" ("+o.sub[best].t+")":""}</span></div><div><small>Needs most work</small><span class="ink">${worst&&L.length>1?worst+" ("+o.sub[worst].t+")":""}</span></div><div><small>${n>1?"Vs Mock "+(n-1):"Progress"}</small><span class="ink">${prog}</span></div></div>
<div class="nt"><b>How to read this slip:</b> grade 1 is the best and 9 the lowest. Aggregate = 4 core subjects (English, Mathematics, Science, Social Studies) + the best 2 others; the lower the aggregate, the better. A mock is practice for the BECE, so use the weakest subjects to plan your revision.</div>
<div class="sg"><div>${sig}Head teacher's signature</div><div>Date</div></div>
<div class="ky"><b>Grading key:</b> ${KEYJ}</div></div>`}
function mockRC(){
 if(!stu.length){$("#bd").innerHTML=mhead()+'<p class="mu">No pupils in this class yet.</p>';return}
 if(!stu.find(s=>s.id==rpid))rpid=stu[0].id;
 const rows=mockCalc(),prev=mk>1?mockCalc(mk-1):null,s=stu.find(x=>x.id==rpid);
 $("#bd").innerHTML=mhead()+`<select onchange="setRP2(this.value)">${stu.map(x=>`<option value="${x.id}" ${x.id==rpid?"selected":""}>${esc(x.name)}</option>`).join("")}</select>${thSel()}<div class="r2"><button class="y" onclick="pmc(0)">🖨 Print / save this slip</button><button onclick="pmc(1)">🖨 Print / save all ${stu.length}</button></div><div style="overflow-x:auto"><div style="min-width:640px">${mcard(s,rows,prev,+mk)}</div></div>${sigBox()}`}
window.pmc=all=>pdfMenu("mk",all);

/* ---------- Admin: overview ---------- */
function ov(){if(tab!="ov")return;
 $("#bd").innerHTML=`<p class="mu">${esc(yr)} · Term ${term} · tap a class to see exactly what its teacher sees.</p>`+CL.map(c=>{
  const P=aS.filter(s=>s.cls==c),ss=subs(c),V=aC[c]||{};let done=0;
  ss.forEach(x=>P.forEach(p=>{if(cs((V[x]||{})[p.id]))done++}));
  const t=P.length*ss.length,pc=t?Math.round(done/t*100):0,st=ss.filter(x=>V[x]).length;
  return`<div class="c" style="cursor:pointer" onclick="goC('${c}')"><div class="g1"><b>${c}</b><div class="mu">${P.length} pupils · ${st} of ${ss.length} subjects started</div><div class="bar"><i style="width:${pc}%"></i></div></div><b style="color:#0b2a8f">${pc}%</b></div>`}).join("")}

/* ---------- Pupils (admin AND teachers, for their own classes) ---------- */
function pupils(){
 const keep=$("#nm")?$("#nm").value:"";
 $("#bd").innerHTML=`<div class="fm"><b>Add pupils to ${cls}</b><p class="mu">One full name per line.</p><textarea id="nm" rows="5" placeholder="Ama Mensah&#10;Kofi Boateng">${esc(keep)}</textarea><button class="y" style="width:100%" onclick="addP()">+ Add pupils</button></div><p class="mu">${stu.length} pupils in ${cls}</p>${stu.map(s=>`<div class="c"><div class="g1">${esc(s.name)}</div><button class="r" onclick="delP('${s.id}')">🗑</button></div>`).join("")}`}
window.addP=async()=>{const n=$("#nm").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!n.length)return;
 const b=writeBatch(db);n.forEach(x=>b.set(doc(collection(db,"students")),{name:x,cls}));
 try{await b.commit();$("#nm").value="";toast(n.length+" pupils added ✅")}catch(e){toast("Failed: "+e.code)}};
window.delP=async id=>{if(confirm("Delete this pupil?"))try{await deleteDoc(doc(db,"students",id))}catch(e){toast(e.code)}};

/* ---------- Admin: teachers ---------- */
function tcForm(){
 $("#bd").innerHTML=`<div class="fm"><b>Add or edit a teacher</b><input id="tn" placeholder="Full name"><input id="te" type="email" placeholder="Teacher's Gmail / email" autocapitalize="none"><input id="tp" type="password" placeholder="Password (6+ characters) – only for a new teacher"><p class="mu">Classes this teacher can enter scores for:</p><div class="chk" id="cb">${CL.map(c=>`<label><input type="checkbox" value="${c}"> ${c}</label>`).join("")}</div><label class="chk1"><input type="checkbox" id="ta"> Admin (sees all classes, adds teachers and pupils)</label><button class="y" style="width:100%" onclick="saveT()">Save teacher</button></div><h4 style="color:#0b2a8f">Teachers</h4><div id="tl"></div>`;tlist()}
function tlist(){const l=$("#tl");if(!l)return;
 l.innerHTML=tl.map(t=>`<div class="c"><div class="g1"><b>${esc(t.name)}</b>${t.admin?" ⭐":""}<div class="mu">${esc(t.e)}<br>${t.admin?"Admin · all classes":esc((t.classes||[]).join(", ")||"No class yet")}</div></div><div class="ac"><button onclick="editT('${esc(t.e)}')">✏️</button><button class="y" onclick="resetT('${esc(t.e)}')">🔑</button><button class="r" onclick="delT('${esc(t.e)}')">🗑</button></div></div>`).join("")||'<p class="mu">No teachers yet.</p>'}
window.editT=e=>{const t=tl.find(x=>x.e==e);if(!t)return;$("#tn").value=t.name||"";$("#te").value=e;$("#te").readOnly=true;$("#ta").checked=!!t.admin;
 document.querySelectorAll("#cb input").forEach(i=>i.checked=(t.classes||[]).includes(i.value));scrollTo(0,0);toast("Editing "+e)};
window.saveT=async()=>{
 const n=$("#tn").value.trim(),e=$("#te").value.trim().toLowerCase(),p=$("#tp").value,cl=[...document.querySelectorAll("#cb input:checked")].map(x=>x.value),ad=$("#ta").checked;
 if(!n||!e.includes("@"))return toast("Enter the name and email");
 try{
  if(p){if(p.length<6)return toast("Password needs 6 or more characters");
   try{await createUserWithEmailAndPassword(auxAuth,e,p);await signOut(auxAuth)}
   catch(er){if(er.code!="auth/email-already-in-use")throw er;toast("That login already existed – profile updated")}}
  await setDoc(doc(db,"teachers",e),{name:n,admin:ad,classes:cl});
  toast(p?"Teacher saved – they can log in now ✅":"Profile saved ✅ (add a password if they have no login yet)");tcForm()}
 catch(er){toast("Failed: "+(er.code||er.message))}};
window.resetT=async e=>{try{await sendPasswordResetEmail(auth,e);toast("Password reset email sent to "+e)}catch(er){toast(er.code)}};
window.delT=async e=>{if(confirm("Remove this teacher's access?"))try{await deleteDoc(doc(db,"teachers",e))}catch(er){toast(er.code)}};
</script></body></html>
