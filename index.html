<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<style>
:root{--b:#0b2a8f;--b2:#1d44c4;--d:#061a63;--y:#f5b800;--yl:#fff3c4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#f2f5fc;color:#1b2133}
[hidden]{display:none!important}
input,select,textarea,button{font:inherit;border-radius:12px;border:1px solid #c9d1e6;padding:11px;margin:4px 0;max-width:100%;background:#fff;color:#1b2133}
input,select,textarea{width:100%}
button{background:var(--b);color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}
button.y{background:var(--y);color:#1b2133}button.r{background:#c0392b;padding:8px 11px;margin:0}
.mu{color:#667089;font-size:13px}.er{color:#ffd1d1;font-size:13px;margin:10px 0 0}
.bg{background:radial-gradient(circle at 50% 28%,var(--b2),var(--b) 55%,var(--d));color:#fff;overflow:hidden}
.bg:before{content:"";position:absolute;right:-100px;top:-100px;width:270px;height:270px;border-radius:50%;background:var(--y)}
.bg:after{content:"";position:absolute;left:-120px;bottom:-120px;width:300px;height:300px;border-radius:50%;background:#ffffff14}
.bg>*{position:relative;z-index:1}
#sp{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s,visibility .6s}
#sp.out{opacity:0;visibility:hidden}
.lgo{width:150px;height:150px;border-radius:38px;background:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 0 0 7px #f5b80066,0 20px 44px #0007;animation:pop .8s ease both}
.lgo.sm{width:118px;height:118px;border-radius:30px}
.lgo img{width:82%}.fb{display:none;font-weight:900;font-size:34px;color:var(--b)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
#sp h1{font-size:21px;letter-spacing:2px;margin:22px 0 4px}
.pill{display:inline-block;margin-top:8px;background:var(--y);color:#1b2133;font-weight:900;letter-spacing:5px;padding:7px 20px;border-radius:22px;font-size:13px}
.ld{display:flex;gap:9px;justify-content:center;margin-top:30px}
.ld i{width:12px;height:12px;border-radius:50%;background:var(--y);animation:bn 1s infinite ease-in-out}
.ld i:nth-child(2){animation-delay:.18s}.ld i:nth-child(3){animation-delay:.36s}
@keyframes bn{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
.vis{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#ffd75e;font-weight:700}
#lg{min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 70px;text-align:center}
.lb{background:#fff;color:#1b2133;border-radius:24px;padding:22px;width:100%;max-width:370px;margin-top:22px;border-bottom:7px solid var(--y);text-align:left}
.lb h2{margin:0 0 6px;color:var(--b);font-size:19px}
.pwr{position:relative}.pwr button{position:absolute;right:4px;top:8px;background:none;color:var(--b);padding:6px 10px;margin:0}
.lb .go{width:100%;background:var(--b);margin-top:8px;padding:13px}
.lb .er{color:#b3261e}
header{position:sticky;top:0;z-index:5;background:var(--b);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:4px solid var(--y)}
header .lo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center}header .lo img{width:32px}header .lo b{display:none;color:var(--b);font-size:12px}
header .t1{flex:1;line-height:1.2;font-size:15px;font-weight:800}header small{font-weight:400;opacity:.9;font-size:11px}
header button{background:#ffffff26;margin:0;padding:8px 12px}
main{max-width:1000px;margin:auto;padding:12px}
.r2{display:flex;gap:6px}.r2>*{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px}.tabs button{flex:none;background:#e6ebf8;color:var(--b);padding:9px 14px;margin:0;border-radius:20px;white-space:nowrap}
.tabs .on{background:var(--y);color:#1b2133;box-shadow:0 2px 6px #0003}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#999}.dot.on{background:#3ddc84}
.tw{overflow:auto;background:#fff;border-radius:12px;max-height:70vh;box-shadow:0 1px 4px #0001}
table.t{border-collapse:collapse;width:100%;font-size:12px}.t th{background:var(--b);color:#fff;padding:6px;white-space:nowrap;border-bottom:3px solid var(--y)}
.t td{border:1px solid #e1e6f4;padding:3px;text-align:center;white-space:nowrap}
.t td:first-child,.t th:first-child{position:sticky;left:0;text-align:left;min-width:120px;font-weight:600}.t td:first-child{background:#fff}
.t input{width:54px;padding:6px 2px;text-align:center;margin:0}.sb{background:var(--yl);font-weight:700}
.c{background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px #0001;border-left:5px solid var(--y)}
.c .g1{flex:1;min-width:0}.ac{display:flex;gap:5px}.ac button{padding:8px 11px;margin:0}
.bar{height:9px;background:#e6ebf8;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),#ffd75e)}
.fm{background:#fff;border-radius:14px;padding:12px;border-top:5px solid var(--y);box-shadow:0 1px 4px #0001}
.chk{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:13px}.chk label,.chk1{display:flex;align-items:center;gap:5px}.chk input,.chk1 input{width:auto;margin:0}
.chk1{font-size:13px;margin:8px 0}
.prt{display:none}
#tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;border:2px solid var(--y);max-width:90%;text-align:center}
@page{size:A4 landscape;margin:8mm}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
header,.r2,.tabs,button,#ss,.mu.np{display:none!important}.scr{display:none!important}.prt{display:block}
.prt .t{margin-bottom:16px;font-size:11px;page-break-inside:avoid}.t td:first-child,.t th:first-child{position:static}main{padding:0}}
</style></head><body>

<div id="sp" class="bg"><div><div class="lgo"><img src="Screenshot_20261030-124739.png" alt="" onerror="this.hidden=true;this.nextElementSibling.style.display='block'"><b class="fb">TSCS</b></div>
<h1>TENDER SPROUT<br>COMM. SCHOOL</h1><div class="pill">SBA SYSTEM</div><div class="ld"><i></i><i></i><i></i></div></div>
<div class="vis">Our Vision · Your Future</div></div>

<div id="lg" class="bg"><div class="lgo sm"><img src="Screenshot_20261030-124739.png" alt="" onerror="this.hidden=true;this.nextElementSibling.style.display='block'"><b class="fb">TSCS</b></div>

<div id="ap" hidden>
<header><div class="lo"><img src="Screenshot_20261030-124739.png" alt="" onerror="this.hidden=true;this.nextElementSibling.style.display='block'"><b>TS</b></div>

<main>
<div class="r2"><select id="cs" onchange="setC(this.value)"></select><select id="tm" onchange="setT(this.value)"><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select><input id="yr" onchange="setY(this.value)"></div>
<select id="ss" onchange="setS(this.value)"></select>

<div id="bd"></div></main></div>

<script>
window.eye=()=>{const p=document.getElementById("pw");p.type=p.type=="password"?"text":"password"};
window.login=()=>{document.getElementById("le").textContent="The app could not load. Open it from your https website (not from the phone's files) and check your internet."};
setTimeout(()=>document.getElementById("sp").classList.add("out"),6500);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,setDoc,deleteDoc,onSnapshot,query,where,writeBatch}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== FIREBASE CONFIG ====== */
const CFG={apiKey:"AIzaSyAOrd-iVpZHU2Oqbi3DNpvX-2VyHykjorE",authDomain:"tscs-sba.firebaseapp.com",projectId:"tscs-sba",storageBucket:"tscs-sba.firebasestorage.app",messagingSenderId:"542177617286",appId:"1:542177617286:web:12e8adfb847e7bc2bcf807"};
/* ============================= */

const app=initializeApp(CFG),auth=getAuth(app),auxAuth=getAuth(initializeApp(CFG,"aux"));
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ord=n=>n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]);
const CL=[1,2,3,4,5,6,7,8,9].map(n=>"Basic "+n),MX=[20,20,20,10,10,100];
const jhs=c=>+c.split(" ")[1]>=7;
const subs=c=>jhs(c)?["English","Mathematics","Science","Social Studies","Computing","RME","Creative Arts","French","Twi","Career Technology"]:["English","Mathematics","Science","History","Computing","RME","Creative Arts","French","Twi"];
function gr(t,j){
 if(j){const a=[[80,1],[70,2],[60,3],[55,4],[50,5],[45,6],[40,7],[35,8],[0,9]].find(x=>t>=x[0]);return[a[1],["","Highest","Higher","High","High Average","Average","Low Average","Low","Lower","Lowest"][a[1]]]}
 const a=[[90,"A+","Excellent"],[80,"A","Very Good"],[70,"B","Good"],[60,"C","Satisfactory"],[50,"D","Fair"],[40,"E","Weak"],[0,"F","Needs Improvement"]].find(x=>t>=x[0]);return[a[1],a[2]]}
function cs(a){if(!a||a.every(v=>v==null))return null;const m=a.slice(0,5).reduce((x,v)=>x+(+v||0),0),c=Math.round(m/80*500)/10,e=Math.round((+a[5]||0)*5)/10;return{c,e,t:Math.round(c+e)}}
const rank=v=>{const s=v.filter(x=>x!=null).sort((a,b)=>b-a);return v.map(x=>x==null?"":s.indexOf(x)+1)};

let me=null,cls="",term=localStorage.t||"1",yr=localStorage.y||"2026/2027",sub="",tab="sc",stu=[],sc={},un=[],ua=[],SIG="",aS=[],aC={},tl=[],ar=false,mn=false;
const YT=()=>yr.replace(/\W+/g,"-")+"-T"+term;
const did=()=>(cls+"_"+YT()+"_"+sub).replace(/\s/g,"");
const mine=()=>me.admin?CL:(me.classes||[]);
function toast(m){const t=$("#tt");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3000)}
const net=()=>{$("#dot").classList.toggle("on",navigator.onLine);$("#ds").textContent=navigator.onLine?"Live":"Offline – will sync"};
addEventListener("online",net);addEventListener("offline",net);
const ready=()=>{ar=true;if(mn)$("#sp").classList.add("out")};
setTimeout(()=>{mn=true;if(ar)$("#sp").classList.add("out")},2300);

/* ---------- Login ---------- */
const AE={"auth/invalid-credential":"Wrong email or password, or this email has not been added in Firebase Authentication yet.","auth/wrong-password":"Wrong password.","auth/user-not-found":"No account with this email. Ask the admin to add you.","auth/invalid-email":"That email is not valid.","auth/operation-not-allowed":"Email/Password sign-in is not switched on in Firebase (Authentication → Sign-in method).","auth/network-request-failed":"No internet connection.","auth/too-many-requests":"Too many tries. Please wait a few minutes.","auth/invalid-api-key":"Your Firebase config is wrong (apiKey). Check CFG in the file.","auth/user-disabled":"This account has been disabled."};
window.login=async()=>{
 const e=$("#le");e.textContent="";$("#lc").textContent="";
 if(CFG.apiKey==="PASTE")return e.textContent="First paste your Firebase config into the file (the CFG lines).";
 const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;
 if(!em||!pw)return e.textContent="Type your email and password.";
 $("#lbtn").disabled=true;
 try{await signInWithEmailAndPassword(auth,em,pw)}catch(x){e.textContent=AE[x.code]||"Could not sign in.";$("#lc").textContent="("+x.code+")"}
 $("#lbtn").disabled=false};
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 if(!u){un.forEach(f=>f());ua.forEach(f=>f());un=[];ua=[];$("#ap").hidden=true;$("#lg").hidden=false;ready();return}
 try{const r=doc(db,"teachers",u.email.toLowerCase());let d=await getDoc(r);
  if(!d.exists()){try{await setDoc(r,{name:u.email,admin:true,classes:[]});d=await getDoc(r)}catch(_){}}
  if(!d.exists()){$("#le").textContent="You signed in as "+u.email+", but this email is not registered as a teacher. Ask the admin to add it.";await signOut(auth);ready();return}
  me=d.data();$("#lg").hidden=true;$("#ap").hidden=false;$("#who").textContent=(me.name||u.email)+(me.admin?" · Admin":"");
  tab=me.admin?"ov":"sc";cls=me.admin?CL[0]:((me.classes||[])[0]||"");net();watch();draw()}
 catch(e){$("#le").textContent="Signed in, but school data could not load ("+e.code+"). Check that the Firestore rules are published.";await signOut(auth)}
 ready()});

/* ---------- Live data ---------- */
function watch(){un.forEach(f=>f());un=[];stu=[];sc={};if(!cls)return;
 un.push(onSnapshot(query(collection(db,"students"),where("cls","==",cls)),s=>{stu=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));live()},e=>toast(e.code)));
 un.push(onSnapshot(query(collection(db,"scores"),where("cls","==",cls),where("yt","==",YT())),s=>{sc={};s.docs.forEach(d=>{const x=d.data();sc[x.subject]=x.v||{}});live()},e=>toast(e.code)))}
function live(){
 if(tab=="sc"){const g=stu.map(s=>s.id).join()+"|"+cls+sub+YT();if(g!==SIG){SIG=g;table()}else fill()}
 else if(tab=="rs")results();else if(tab=="pu")pupils()}
function wAll(){
 ua.push(onSnapshot(collection(db,"students"),s=>{aS=s.docs.map(d=>({id:d.id,...d.data()}));ov()},e=>toast(e.code)));
 ua.push(onSnapshot(query(collection(db,"scores"),where("yt","==",YT())),s=>{aC={};s.docs.forEach(d=>{const x=d.data();(aC[x.cls]=aC[x.cls]||{})[x.subject]=x.v||{}});ov()},e=>toast(e.code)))}
function wT(){ua.push(onSnapshot(collection(db,"teachers"),s=>{tl=s.docs.map(d=>({e:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||""));tlist()},e=>toast(e.code)))}

/* ---------- Navigation ---------- */
function ctl(){const m=mine(),ss=subs(cls||"Basic 1");if(!ss.includes(sub))sub=ss[0];
 $("#cs").innerHTML=m.map(c=>`<option ${c==cls?"selected":""}>${c}</option>`).join("");
 $("#ss").innerHTML=ss.map(c=>`<option ${c==sub?"selected":""}>${c}</option>`).join("");$("#tm").value=term;$("#yr").value=yr}
function draw(){ctl();SIG="";ua.forEach(f=>f());ua=[];
 document.querySelectorAll(".ad").forEach(b=>b.hidden=!me.admin);
 document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 $("#ss").hidden=tab!="sc";$("#cs").hidden=(tab=="ov"||tab=="tc");
 if(tab=="ov"){$("#bd").innerHTML="";wAll();return}
 if(tab=="tc"){tcForm();wT();return}
 if(!cls){$("#bd").innerHTML='<p class="mu">No class has been assigned to you yet. Ask the admin.</p>';return}
 live()}
window.setC=v=>{cls=v;watch();draw()};window.setT=v=>{term=v;localStorage.t=v;watch();draw()};
window.setY=v=>{yr=v.trim()||yr;localStorage.y=yr;watch();draw()};window.setS=v=>{sub=v;draw()};window.setTab=t=>{tab=t;draw()};
window.goC=c=>{cls=c;tab="sc";watch();draw()};

/* ---------- Scores ---------- */
function table(){
 $("#bd").innerHTML=stu.length?`<p class="mu">3 tests /20 · project /10 · group /10 → scaled to 50. Exam /100 → scaled to 50. Saves instantly and every teacher sees it live.</p><div class="tw"><table class="t"><tr><th>Pupil</th><th>Test 1<br>/20</th><th>Test 2<br>/20</th><th>Test 3<br>/20</th><th>Project<br>/10</th><th>Group<br>/10</th><th>Exam<br>/100</th><th>Class<br>/50</th><th>Exam<br>/50</th><th>Total</th><th>Grd</th><th>Pos</th><th>Remark</th></tr>${stu.map(s=>`<tr data-id="${s.id}"><td>${esc(s.name)}</td>${MX.map((m,i)=>`<td><input type="number" inputmode="decimal" min="0" max="${m}" data-i="${i}" data-m="${m}"></td>`).join("")}<td class="c1"></td><td class="e1"></td><td class="t1 sb"></td><td class="g1"></td><td class="p1"></td><td class="r1"></td></tr>`).join("")}</table></div>`:'<p class="mu">No pupils in this class yet. The admin adds them in the Pupils tab.</p>';fill()}
function fill(){if(tab!="sc"||!stu.length)return;
 const j=jhs(cls),V=sc[sub]||{},r=stu.map(s=>cs(V[s.id])),p=rank(r.map(x=>x&&x.t));
 stu.forEach((s,k)=>{const tr=document.querySelector(`tr[data-id="${s.id}"]`);if(!tr)return;
  const a=V[s.id]||[],x=r[k],g=x?gr(x.t,j):["",""],set=(c,v)=>tr.querySelector("."+c).textContent=v;
  tr.querySelectorAll("input").forEach((e,i)=>{if(document.activeElement!==e)e.value=a[i]??""});
  set("c1",x?x.c:"");set("e1",x?x.e:"");set("t1",x?x.t:"");set("g1",g[0]);set("p1",x?ord(p[k]):"");set("r1",g[1])})}
$("#bd").addEventListener("change",async e=>{
 const el=e.target;if(el.dataset.i===undefined)return;
 const id=el.closest("tr").dataset.id,k=+el.dataset.i,m=+el.dataset.m;
 const v=el.value===""?null:Math.max(0,Math.min(m,+el.value));if(v!==null&&v!=+el.value)el.value=v;
 const a=((sc[sub]||{})[id]||[null,null,null,null,null,null]).slice();a[k]=v;(sc[sub]=sc[sub]||{})[id]=a;fill();
 try{await setDoc(doc(db,"scores",did()),{cls,yt:YT(),subject:sub,v:{[id]:a}},{merge:true})}catch(er){toast("Not saved: "+er.code)}});

/* ---------- Results (screen scrolls; print splits into stacked parts) ---------- */
function results(){
 const j=jhs(cls),ss=subs(cls),rows=stu.map(s=>({s,sub:{},gt:0,n:0}));
 ss.forEach(x=>{const r=rows.map(o=>cs((sc[x]||{})[o.s.id]));
  rows.forEach((o,i)=>{const y=r[i];if(y){o.sub[x]={t:y.t,g:gr(y.t,j)[0]};o.gt+=y.t;o.n++}})});
 rows.forEach(o=>{o.avg=o.n?Math.round(o.gt/o.n*10)/10:0;
  if(j){const core=["English","Mathematics","Science","Social Studies"],g=ss.filter(x=>o.sub[x]).map(x=>({x,g:o.sub[x].g})),a=g.filter(v=>core.includes(v.x)).map(v=>v.g),b=g.filter(v=>!core.includes(v.x)).map(v=>v.g).sort((p,q)=>p-q).slice(0,2);o.ag=a.length==4&&b.length==2?a.concat(b).reduce((p,q)=>p+q,0):null}});
 const rk=rows.filter(o=>o.n).sort((a,b)=>j?((a.ag??99)-(b.ag??99))||b.gt-a.gt:b.gt-a.gt);
 rows.forEach(o=>o.pos=o.n?rk.findIndex(x=>x.gt===o.gt&&x.ag===o.ag)+1:"");
 const cell=(o,x)=>`<td>${o.sub[x]?o.sub[x].t+" <b>("+o.sub[x].g+")</b>":""}</td>`;
 const tot=o=>`<td class="sb">${o.n?o.gt:""}</td><td>${o.n?o.avg:""}</td>${j?`<td class="sb">${o.ag??""}</td>`:""}<td class="sb">${o.pos?ord(o.pos):""}</td>`;
 const th=`<th>Total</th><th>Avg</th>${j?"<th>Agg</th>":""}<th>Pos</th>`;
 const tb=(p,l)=>`<table class="t"><tr><th>Pupil</th>${p.map(x=>`<th>${x}</th>`).join("")}${l?th:""}</tr>${rows.map(o=>`<tr><td>${esc(o.s.name)}</td>${p.map(x=>cell(o,x)).join("")}${l?tot(o):""}</tr>`).join("")}</table>`;
 const n=Math.ceil(ss.length/5),z=Math.ceil(ss.length/n);let pr="";for(let b=0;b<n;b++)pr+=`<p><b>Part ${b+1} of ${n}</b></p>`+tb(ss.slice(b*z,b*z+z),b==n-1);
 $("#bd").innerHTML=`<p class="mu np">${cls} · ${esc(yr)} · Term ${term} — updates live. Each cell shows total (grade). Scroll sideways to see all subjects.</p><div class="tw scr">${tb(ss,true)}</div><div class="prt"><h3 style="color:#0b2a8f">Tender Sprout Comm. School — ${cls} · ${esc(yr)} · Term ${term}</h3>${pr}</div><button class="y" style="width:100%;margin-top:8px" onclick="print()">🖨 Print (all subjects, nothing cut off)</button>`}

/* ---------- Admin: overview ---------- */
function ov(){if(tab!="ov")return;
 $("#bd").innerHTML=`<p class="mu">${esc(yr)} · Term ${term} · tap a class to see exactly what its teacher sees.</p>`+CL.map(c=>{
  const P=aS.filter(s=>s.cls==c),ss=subs(c),V=aC[c]||{};let done=0;
  ss.forEach(x=>P.forEach(p=>{if(cs((V[x]||{})[p.id]))done++}));
  const t=P.length*ss.length,pc=t?Math.round(done/t*100):0,st=ss.filter(x=>V[x]).length;
  return`<div class="c" style="cursor:pointer" onclick="goC('${c}')"><div class="g1"><b>${c}</b><div class="mu">${P.length} pupils · ${st} of ${ss.length} subjects started</div><div class="bar"><i style="width:${pc}%"></i></div></div><b style="color:#0b2a8f">${pc}%</b></div>`}).join("")}

/* ---------- Admin: pupils ---------- */
function pupils(){
 const keep=$("#nm")?$("#nm").value:"";
 $("#bd").innerHTML=`<div class="fm"><b>Add pupils to ${cls}</b><p class="mu">One full name per line.</p><textarea id="nm" rows="5" placeholder="Ama Mensah&#10;Kofi Boateng">${esc(keep)}</textarea><button class="y" style="width:100%" onclick="addP()">+ Add pupils</button></div><p class="mu">${stu.length} pupils in ${cls}</p>${stu.map(s=>`<div class="c"><div class="g1">${esc(s.name)}</div><button class="r" onclick="delP('${s.id}')">🗑</button></div>`).join("")}`}
window.addP=async()=>{const n=$("#nm").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!n.length)return;
 const b=writeBatch(db);n.forEach(x=>b.set(doc(collection(db,"students")),{name:x,cls}));
 try{await b.commit();$("#nm").value="";toast(n.length+" pupils added ✅")}catch(e){toast("Failed: "+e.code)}};
window.delP=async id=>{if(confirm("Delete this pupil?"))try{await deleteDoc(doc(db,"students",id))}catch(e){toast(e.code)}};

/* ---------- Admin: teachers ---------- */
function tcForm(){
 $("#bd").innerHTML=`<div class="fm"><b>Add or edit a teacher</b><input id="tn" placeholder="Full name"><input id="te" type="email" placeholder="Teacher's Gmail / email" autocapitalize="none"><input id="tp" type="password" placeholder="Password (6+ characters) – only for a new teacher"><p class="mu">Classes this teacher can enter scores for:</p><div class="chk" id="cb">${CL.map(c=>`<label><input type="checkbox" value="${c}"> ${c}</label>`).join("")}</div><label class="chk1"><input type="checkbox" id="ta"> Admin (sees all classes, adds teachers and pupils)</label><button class="y" style="width:100%" onclick="saveT()">Save teacher</button></div><h4 style="color:#0b2a8f">Teachers</h4><div id="tl"></div>`;tlist()}
function tlist(){const l=$("#tl");if(!l)return;
 l.innerHTML=tl.map(t=>`<div class="c"><div class="g1"><b>${esc(t.name)}</b>${t.admin?" ⭐":""}<div class="mu">${esc(t.e)}<br>${t.admin?"Admin · all classes":esc((t.classes||[]).join(", ")||"No class yet")}</div></div><div class="ac"><button onclick="editT('${esc(t.e)}')">✏️</button><button class="y" onclick="resetT('${esc(t.e)}')">🔑</button><button class="r" onclick="delT('${esc(t.e)}')">🗑</button></div></div>`).join("")||'<p class="mu">No teachers yet.</p>'}
window.editT=e=>{const t=tl.find(x=>x.e==e);if(!t)return;$("#tn").value=t.name||"";$("#te").value=e;$("#te").readOnly=true;$("#ta").checked=!!t.admin;
 document.querySelectorAll("#cb input").forEach(i=>i.checked=(t.classes||[]).includes(i.value));scrollTo(0,0);toast("Editing "+e)};
window.saveT=async()=>{
 const n=$("#tn").value.trim(),e=$("#te").value.trim().toLowerCase(),p=$("#tp").value,cl=[...document.querySelectorAll("#cb input:checked")].map(x=>x.value),ad=$("#ta").checked;
 if(!n||!e.includes("@"))return toast("Enter the name and email");
 try{
  if(p){if(p.length<6)return toast("Password needs 6 or more characters");
   try{await createUserWithEmailAndPassword(auxAuth,e,p);await signOut(auxAuth)}
   catch(er){if(er.code!="auth/email-already-in-use")throw er;toast("That login already existed – profile updated")}}
  await setDoc(doc(db,"teachers",e),{name:n,admin:ad,classes:cl});
  toast(p?"Teacher saved – they can log in now ✅":"Profile saved ✅ (add a password if they have no login yet)");tcForm()}
 catch(er){toast("Failed: "+(er.code||er.message))}};
window.resetT=async e=>{try{await sendPasswordResetEmail(auth,e);toast("Password reset email sent to "+e)}catch(er){toast(er.code)}};
window.delT=async e=>{if(confirm("Remove this teacher's access?"))try{await deleteDoc(doc(db,"teachers",e))}catch(er){toast(er.code)}};
</script></body></html>
