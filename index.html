<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBA System – Tender Sprout Comm. School</title>
<style>
  :root { --green:#2e7d32; --green-dark:#1b5e20; --bg:#f1f8f2; --text:#1f2937; --err:#c62828; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* Splash */
  #splash { position:fixed; inset:0; background:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; z-index:100; transition:opacity .5s; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { width:min(60vw,220px); height:auto; margin-bottom:20px; }
  #splash h1 { font-size:2rem; color:var(--green-dark); }
  #splash p { margin-top:6px; color:#555; font-style:italic; }
  .dots { display:flex; gap:8px; margin-top:28px; }
  .dots span { width:10px; height:10px; border-radius:50%; background:var(--green); animation:bounce 1.2s infinite ease-in-out; }
  .dots span:nth-child(2){ animation-delay:.2s; }
  .dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes bounce { 0%,80%,100%{ transform:scale(.5); opacity:.4 } 40%{ transform:scale(1); opacity:1 } }

  /* Login */
  #loginView { min-height:100vh; display:none; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; width:100%; max-width:400px; padding:32px 26px; border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .card img { display:block; width:90px; margin:0 auto 12px; }
  .card h2 { text-align:center; color:var(--green-dark); margin-bottom:4px; }
  .card .sub { text-align:center; color:#666; font-size:.9rem; margin-bottom:24px; }
  label { display:block; font-size:.85rem; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; border:1px solid #cfd8d3; border-radius:10px; font-size:1rem; }
  input:focus { outline:2px solid var(--green); border-color:var(--green); }
  .pw { position:relative; }
  .pw button { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--green-dark); font-size:.8rem; cursor:pointer; padding:6px; }
  #loginBtn { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px;
    background:var(--green); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  #loginBtn:hover { background:var(--green-dark); }
  #loginBtn:disabled { opacity:.6; cursor:not-allowed; }
  #msg { margin-top:14px; font-size:.88rem; text-align:center; min-height:1.2em; }
  #msg.error { color:var(--err); }
  #msg.ok { color:var(--green-dark); }
  .link { display:block; text-align:center; margin-top:14px; font-size:.85rem; color:var(--green-dark);
    background:none; border:none; cursor:pointer; width:100%; text-decoration:underline; }

  /* After login (placeholder dashboard) */
  #appView { display:none; padding:24px; }
  #appView header { display:flex; justify-content:space-between; align-items:center; }
  #logoutBtn { padding:8px 14px; border:1px solid var(--green); background:#fff; color:var(--green-dark);
    border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="logo.png" alt="Tender Sprout Comm. School logo">
  <h1>SBA System</h1>
  <p>Your Vision, Your Future</p>
  <div class="dots"><span></span><span></span><span></span></div>
</div>

<!-- Login -->
<div id="loginView">
  <div class="card">
    <img src="logo.png" alt="Logo">
    <h2>SBA System</h2>
    <p class="sub">Teacher sign in</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="teacher@example.com">

    <label for="password">Password</label>
    <div class="pw">
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
      <button type="button" id="togglePw">Show</button>
    </div>

    <button id="loginBtn">Log in</button>
    <button class="link" id="resetBtn" type="button">Forgot password?</button>
    <div id="msg"></div>
  </div>
</div>

<!-- App (replace with your real dashboard) -->
<div id="appView">
  <header>
    <h2>Welcome, <span id="who"></span></h2>
    <button id="logoutBtn">Log out</button>
  </header>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAOrd-iVpZHU2Oqbi3DNpvX-2VyHykjorE",
    authDomain: "tscs-sba.firebaseapp.com",
    projectId: "tscs-sba",
    storageBucket: "tscs-sba.firebasestorage.app",
    messagingSenderId: "542177617286",
    appId: "1:542177617286:web:12e8adfb847e7bc2bcf807",
    measurementId: "G-4S4CNH6ZN2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const $ = id => document.getElementById(id);
  const splash = $("splash"), loginView = $("loginView"), appView = $("appView");
  const msg = $("msg"), loginBtn = $("loginBtn");

  const setMsg = (text, type="error") => { msg.textContent = text; msg.className = type; };

  const friendlyError = code => ({
    "auth/invalid-email": "That email address isn't valid.",
    "auth/user-disabled": "This account has been disabled. Contact the admin.",
    "auth/user-not-found": "Incorrect email or password.",
    "auth/wrong-password": "Incorrect email or password.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/too-many-requests": "Too many attempts. Please wait and try again.",
    "auth/network-request-failed": "Network error. Check your connection."
  }[code] || "Login failed. Please try again.");

  // Keep splash visible for at least 2.5s, then show the right screen
  const minSplash = new Promise(r => setTimeout(r, 2500));
  onAuthStateChanged(auth, async user => {
    await minSplash;
    splash.classList.add("hide");
    if (user) {
      loginView.style.display = "none";
      appView.style.display = "block";
      $("who").textContent = user.email;
    } else {
      appView.style.display = "none";
      loginView.style.display = "flex";
    }
  });

  async function doLogin() {
    const email = $("email").value.trim();
    const password = $("password").value;
    if (!email || !password) return setMsg("Enter your email and password.");
    loginBtn.disabled = true; loginBtn.textContent = "Signing in…"; setMsg("");
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      setMsg(friendlyError(e.code));
    } finally {
      loginBtn.disabled = false; loginBtn.textContent = "Log in";
    }
  }

  loginBtn.addEventListener("click", doLogin);
  $("password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

  $("togglePw").addEventListener("click", () => {
    const p = $("password"), show = p.type === "password";
    p.type = show ? "text" : "password";
    $("togglePw").textContent = show ? "Hide" : "Show";
  });

  $("resetBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) return setMsg("Type your email above first, then tap Forgot password.");
    try {
      await sendPasswordResetEmail(auth, email);
      setMsg("Password reset email sent. Check your inbox.", "ok");
    } catch (e) {
      setMsg(friendlyError(e.code));
    }
  });

  $("logoutBtn").addEventListener("click", () => signOut(auth));
</script>
</body>
</html>
